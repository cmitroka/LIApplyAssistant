<div class="shell">
  <header class="topbar">
    <a class="brand" routerLink="/" aria-label="JobGrid home">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
          <rect x="3" y="3" width="7" height="7" rx="1.5" fill="currentColor" />
          <rect x="14" y="3" width="7" height="7" rx="1.5" fill="currentColor" opacity="0.7" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" fill="currentColor" opacity="0.7" />
          <rect x="14" y="14" width="7" height="7" rx="1.5" fill="currentColor" />
        </svg>
      </span>
      <span class="brand__name">JobGrid</span>
    </a>

    <nav class="nav" aria-label="Primary">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
        Paste &amp; Parse
      </a>
      <a routerLink="/jobs" routerLinkActive="is-active">Job Grid</a>
    </nav>
  </header>

  <main class="main">
    <router-outlet />
  </main>
</div>
