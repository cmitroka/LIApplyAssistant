# Deploys the Angular SPA to Azure Static Web Apps.
# The .NET API is not part of this workflow: Static Web Apps cannot host it.
# See README "Engineering practices".
#
# Without the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN the job finishes
# successfully and does not deploy. Create the Static Web App, then add the token.

name: Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: azure-swa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  azure-static-web-apps:
    name: azure-static-web-apps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check deployment token
        id: guard
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "${AZURE_STATIC_WEB_APPS_API_TOKEN}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Azure Static Web Apps skipped::Secret AZURE_STATIC_WEB_APPS_API_TOKEN is not set. Deploy and preview close were skipped."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.present == 'true' && github.event.action != 'closed'
        uses: actions/checkout@v7

      - name: Setup Node
        if: steps.guard.outputs.present == 'true' && github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and build production
        if: steps.guard.outputs.present == 'true' && github.event.action != 'closed'
        working-directory: web
        run: |
          npm ci
          npm run build -- --configuration=production

      - name: Deploy
        if: steps.guard.outputs.present == 'true' && github.event.action != 'closed'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web/dist/jobgrid/browser
          api_location: ''
          output_location: ''
          skip_app_build: true

      - name: Close preview environment
        if: steps.guard.outputs.present == 'true' && github.event.action == 'closed'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: web
